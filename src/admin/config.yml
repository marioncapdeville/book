backend:
  name: github
  repo: marioncapdeville/book
  branch: main
  base_url: https://marioncapdeville.com
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "src/images/uploads"
public_folder: "/images/uploads"

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "projects"
    label: "Projets"
    label_singular: "Projet"
    folder: "src/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    sortable_fields: ["order", "title", "category"]
    fields:
      - label: "Titre du projet"
        name: "title"
        widget: "string"

      - label: "Identifiant (slug)"
        name: "slug"
        widget: "string"
        hint: "Utilisé dans l'adresse de la page projet (ex: mon-projet). Ne pas modifier après publication."

      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Identité", value: "identite-de-marque" }
          - { label: "Stylisme photo", value: "stylisme-photo" }
          - { label: "Édition", value: "edition" }
          - { label: "Objets", value: "packaging-objets" }
          - { label: "Explorations", value: "travaux-personnels" }
          - { label: "Scénographie (hors menu, visible seulement dans Tous les projets)", value: "scenographie" }
          - { label: "Hors catégorie (visible seulement dans Tous les projets)", value: "hors-categorie" }

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Un mot-clé par ligne. Sert à suggérer des projets similaires."

      - label: "Visuel de couverture"
        name: "cover"
        widget: "file"
        hint: "Visuel affiché sur la page d'accueil et dans les vignettes. Accepte aussi les GIF (animés) et vidéos (.mp4). Uploader un nouveau fichier remplace l'existant."

      - label: "Texte alternatif de la couverture"
        name: "coverAlt"
        widget: "string"
        required: false
        hint: "Décrit l'image pour l'accessibilité et le référencement (ex: \"Flacon Immortelle posé sur fond beige\"). Laisser vide pour reprendre le titre du projet."

      - label: "Accroche courte"
        name: "excerpt"
        widget: "string"
        required: false
        hint: "Une phrase affichée en haut de la page du projet."

      - label: "SEO"
        name: "seo"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "Meta description"
            name: "description"
            widget: "text"
            required: false
            hint: "Le texte affiché sous le titre dans les résultats Google. Idéal : 150-160 caractères. Laissé vide, une description générique du site est utilisée."
          - label: "Mot-clé principal"
            name: "primaryKeyword"
            widget: "string"
            required: false
            hint: "Aide-mémoire pour toi : le mot-clé à viser en priorité pour cette page. N'est pas publié sur le site — sert à vérifier que le titre, le texte et l'alt l'utilisent naturellement."
          - label: "Mots-clés secondaires"
            name: "secondaryKeywords"
            widget: "list"
            required: false
            hint: "Idem, un mot-clé secondaire par ligne. Aide-mémoire uniquement, non publié (la balise \"meta keywords\" n'a plus d'effet sur le référencement depuis longtemps)."

      - label: "Ordre d'affichage"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 50
        hint: "Détermine la position sur la page d'accueil et dans sa catégorie. Plus le nombre est petit, plus le projet apparaît tôt."

      - label: "Format de la case (grille d'accueil)"
        name: "cardFormat"
        widget: "select"
        required: false
        options:
          - { label: "Carré", value: "carre" }
          - { label: "Paysage", value: "paysage" }
          - { label: "Portrait", value: "portrait" }
        hint: "Laisser vide pour un format automatique. S'applique à toutes les vignettes du projet si plusieurs visuels d'entrée."

      - label: "Masquer ce projet"
        name: "hidden"
        widget: "boolean"
        default: false
        hint: "Active pour retirer temporairement le projet du site sans le supprimer."

      - label: "Galerie du projet"
        name: "gallery"
        widget: "list"
        summary: "{{fields.alt}}"
        fields:
          - label: "Visuel"
            name: "image"
            widget: "file"
            hint: "Photo, GIF animé ou vidéo (.mp4)."
          - label: "Texte alternatif"
            name: "alt"
            widget: "string"
            hint: "Décrit ce que montre ce visuel précisément, pour l'accessibilité et le référencement (ignoré pour les vidéos)."

      - label: "Texte de présentation"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Le texte affiché sous le titre, sur la page du projet."

  - name: "pages"
    label: "Pages"
    files:
      - label: "Manifeste"
        name: "manifeste"
        file: "src/manifeste.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - label: "Photo"
            name: "photo"
            widget: "file"
            hint: "Portrait affiché sur la page Manifeste. Accepte aussi les GIF et vidéos (.mp4)."
          - { label: "Texte alternatif de la photo", name: "photoAlt", widget: "string", required: false }
          - label: "Texte"
            name: "body"
            widget: "markdown"
            hint: "Ce champ contient le HTML de la page (accroche, citation, bio) — modifie le texte avec précaution sans casser les balises."

      - label: "Réglages du site"
        name: "site_settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Nom affiché dans l'en-tête", name: "name", widget: "string" }
          - { label: "Fonction (sous le nom, en-tête)", name: "role", widget: "string" }
          - { label: "Phrase d'accroche (référencement)", name: "tagline", widget: "string" }
          - { label: "Adresse du site", name: "url", widget: "string" }
          - { label: "Email (pied de page)", name: "email", widget: "string" }
          - { label: "Lien Instagram", name: "instagram", widget: "string" }
          - { label: "Lien LinkedIn", name: "linkedin", widget: "string" }
          - label: "Menu (ordre d'affichage)"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Libellé", name: "label", widget: "string" }
              - { label: "Lien", name: "url", widget: "string" }
          - label: "Catégories"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Identifiant", name: "slug", widget: "string" }
              - { label: "Libellé", name: "label", widget: "string" }
          - label: "Catégories avec leur propre page"
            name: "navCategories"
            widget: "list"
            fields:
              - { label: "Identifiant", name: "slug", widget: "string" }
              - { label: "Libellé", name: "label", widget: "string" }
